# Repeat for all layers
# Prepare activations for probing
for size in 7 9 11 13 15; do
interp-cli prepare_activations_for_probing \
    --activations-dir data/activations_train_single_step/size${size} \
    --trajectories-dir data/trajectories_train_single_step/size${size} \
    --probe-type grid_tile \
    --layers "15" \
    --prompt_suffix_indices "-3:-1"
done

# MLP probe 
for size in 7 9 11 13 15; do
interp-cli train_cognitive_map_probe \
    --train-data-path data/activations_train_single_step/size${size}/cognitive_map_activations_l15_s0_suffix_-3--1_grid_tile_grid${size}.pt \
    --output-path data/probes_train_single_step/size${size}/cognitive_map_probe_suffix_-3--1_mlp_1024_full_no_eval.pt \
    --model-type mlp \
    --hidden-dims "1024" \
    --learning-rate 3e-4 \
    --weight-decay 0.001 \
    --num-epochs 200 \
    --batch-size 2048  \
    --device cuda \
    --verbose \
    --normalize \
    --subset 1.0 \
    --dropout 0.0 \
    --balance-classes \
    --eval-split 0.0
done

# Logistic regression probe
for size in 7 9 11 13 15; do
interp-cli train_cognitive_map_probe \
    --train-data-path data/activations_train_single_step/size${size}/cognitive_map_activations_l15_s0_suffix_-3--1_grid_tile_grid${size}.pt \
    --output-path data/probes_train_single_step/size${size}/cognitive_map_probe_suffix_-3--1_lr_full_no_eval.pt \
    --model-type lr \
    --hidden-dims "1024" \
    --learning-rate 3e-4 \
    --weight-decay 0.001 \
    --num-epochs 200 \
    --batch-size 2048  \
    --device cuda \
    --verbose \
    --normalize \
    --subset 1.0 \
    --dropout 0.0 \
    --balance-classes \
    --eval-split 0.0
done


# Apply MLP probe
for size in 7 9 11 13 15; do
    interp-cli apply_cognitive_map_probe \
        --activations-dir data/activations_test_full/size${size} \
        --trajectories-dir data/trajectories_test_full/size${size} \
        --probe-path data/probes_train_single_step/size${size}/cognitive_map_probe_suffix_-3--1_mlp_1024_full_no_eval.pt \
        --output-dir data/trajectories_with_probes/suffix_-3--1/mlp/size${size} \
        --layers 15 \
        --steps all \
        --prompt-suffix-indices -3:-1
done

# Apply logistic regression probe
for size in 7 9 11 13 15; do
    interp-cli apply_cognitive_map_probe \
        --activations-dir data/activations_test_full/size${size} \
        --trajectories-dir data/trajectories_test_full/size${size} \
        --probe-path data/probes_train_single_step/size${size}/cognitive_map_probe_suffix_-3--1_lr_full_no_eval.pt \
        --output-dir data/trajectories_with_probes/suffix_-3--1/lr/size${size} \
        --layers 15 \
        --steps all \
        --prompt-suffix-indices -3:-1
done