# Size 7
interp-cli prepare_activations_for_probing \
    --activations-dir data/activations/trajectories_train_single_step/size7 \
    --trajectories-dir data/trajectories_train_single_step/size7 \
    --probe-type grid_tile \
    --layers "15" \
    --prompt_suffix_indices -1

interp-cli train_cognitive_map_probe \
    --train-data-path data/activations/trajectories_train_single_step/size7/cognitive_map_activations_l15_s0_suffix_-1_grid_tile_grid7.pt \
    --output-path data/probes_train_single_step/size7/cognitive_map_probe_mlp_1024.pt \
    --model-type mlp \
    --hidden-dims "1024" \
    --learning-rate 3e-4 \
    --weight-decay 0.001 \
    --num-epochs 200 \
    --batch-size 2048  \
    --device cuda \
    --verbose \
    --normalize \
    --subset 1.0 \
    --dropout 0.0 \
    --balance-classes


