# Train both types of tokens full datasets without the eval subset and apply to the test set. Only on size 11, only mlp.
# BTW this is done in main accuracy experiment, in apply_trained_probes.conf
# prompt suffix indices -3:-1
interp-cli train_cognitive_map_probe \
    --train-data-path data/activations_train_single_step/size11/cognitive_map_activations_l15_s0_suffix_-3--1_grid_tile_grid11.pt \
    --output-path data/probes_train_single_step/size11/cognitive_map_probe_suffix_-3--1_mlp_1024_full_no_eval.pt \
    --model-type mlp \
    --hidden-dims "1024" \
    --learning-rate 3e-4 \
    --weight-decay 0.001 \
    --num-epochs 200 \
    --batch-size 2048  \
    --device cuda \
    --verbose \
    --normalize \
    --subset 1.0 \
    --dropout 0.0 \
    --balance-classes \
    --eval-split 0.0

# Apply to the test set
interp-cli apply_cognitive_map_probe \
    --activations-dir data/activations_test_full/size11 \
    --trajectories-dir data/trajectories_test_full/size11 \
    --probe-path data/probes_train_single_step/size11/cognitive_map_probe_suffix_-3--1_mlp_1024_full_no_eval.pt \
    --output-dir data/trajectories_with_probes/suffix_-3--1/mlp/size11 \
    --layers 15 \
    --steps all \
    --prompt-suffix-indices -3:-1

# output indices all
interp-cli train_cognitive_map_probe \
