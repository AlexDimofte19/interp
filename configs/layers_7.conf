    data/activations/gpt-oss-20b/size7_numenvs1000_trajectorysteps20/observability_full_full_prompt/grid_last_prompt_layer_${layer}_x_y/probes/multiclass_probe_layer_${layer}_gpu_mlp1024_normalized_balanced.pkl \
